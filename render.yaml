services:
  - type: web
    name: workspacesafety-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workspacesafety-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://workspacesafety-m5ri-9cba032ai-mind-mesh10.vercel.app
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: workspacesafety-db
    databaseName: workspacesafety
    user: workspacesafety
    plan: free
