services:
  - type: web
    name: workspacesafety-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: workspacesafety-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://workspacesafety-tu5g.vercel.app
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: workspacesafety-db
    databaseName: workspacesafety
    user: workspacesafety
    plan: free
