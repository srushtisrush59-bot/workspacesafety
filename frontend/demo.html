<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workplace Safety Sentinel - Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        function App() {
            const [stats, setStats] = useState({
                total_incidents: 0,
                active_hazards: 0,
                cameras_online: 0,
                safety_score: 0
            });
            const [incidents, setIncidents] = useState([]);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                // Fetch dashboard stats
                axios.get('http://localhost:8000/api/dashboard/stats')
                    .then(response => {
                        setStats(response.data);
                        setLoading(false);
                    })
                    .catch(error => {
                        console.error('Error fetching stats:', error);
                        setLoading(false);
                    });
                
                // Fetch recent incidents
                axios.get('http://localhost:8000/api/incidents?skip=0&limit=5')
                    .then(response => {
                        setIncidents(response.data);
                    })
                    .catch(error => {
                        console.error('Error fetching incidents:', error);
                    });
            }, []);
            
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-2xl">Loading Workplace Safety Sentinel...</div>
                    </div>
                );
            }
            
            return (
                <div className="min-h-screen bg-gray-900">
                    {/* Header */}
                    <header className="bg-gray-800 border-b border-gray-700">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center">
                                    <svg className="w-8 h-8 text-blue-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                    </svg>
                                    <h1 className="text-2xl font-bold text-white">Workplace Safety Sentinel</h1>
                                </div>
                                <div className="text-sm text-gray-400">Microsoft Hackathon Demo</div>
                            </div>
                        </div>
                    </header>
                    
                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Stats Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                            <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <p className="text-gray-400 text-sm">Total Incidents</p>
                                        <p className="text-3xl font-bold text-white mt-2">{stats.total_incidents}</p>
                                    </div>
                                    <div className="bg-red-500/10 p-3 rounded-lg">
                                        <svg className="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <p className="text-gray-400 text-sm">Active Hazards</p>
                                        <p className="text-3xl font-bold text-white mt-2">{stats.active_hazards}</p>
                                    </div>
                                    <div className="bg-yellow-500/10 p-3 rounded-lg">
                                        <svg className="w-8 h-8 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <p className="text-gray-400 text-sm">Cameras Online</p>
                                        <p className="text-3xl font-bold text-white mt-2">{stats.cameras_online}</p>
                                    </div>
                                    <div className="bg-green-500/10 p-3 rounded-lg">
                                        <svg className="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <p className="text-gray-400 text-sm">Safety Score</p>
                                        <p className="text-3xl font-bold text-white mt-2">{stats.safety_score}%</p>
                                    </div>
                                    <div className="bg-blue-500/10 p-3 rounded-lg">
                                        <svg className="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        {/* Recent Incidents */}
                        <div className="bg-gray-800 rounded-lg border border-gray-700">
                            <div className="px-6 py-4 border-b border-gray-700">
                                <h2 className="text-xl font-semibold text-white">Recent Incidents</h2>
                            </div>
                            <div className="p-6">
                                {incidents.length === 0 ? (
                                    <p className="text-gray-400 text-center py-8">No incidents recorded</p>
                                ) : (
                                    <div className="space-y-4">
                                        {incidents.map((incident) => (
                                            <div key={incident.id} className="bg-gray-900 rounded-lg p-4 border border-gray-700">
                                                <div className="flex items-start justify-between">
                                                    <div className="flex-1">
                                                        <div className="flex items-center gap-3 mb-2">
                                                            <span className={`px-3 py-1 rounded-full text-xs font-medium ${
                                                                incident.severity === 'critical' ? 'bg-red-500/20 text-red-400' :
                                                                incident.severity === 'high' ? 'bg-orange-500/20 text-orange-400' :
                                                                incident.severity === 'medium' ? 'bg-yellow-500/20 text-yellow-400' :
                                                                'bg-blue-500/20 text-blue-400'
                                                            }`}>
                                                                {incident.severity}
                                                            </span>
                                                            <span className={`px-3 py-1 rounded-full text-xs font-medium ${
                                                                incident.status === 'open' ? 'bg-red-500/20 text-red-400' :
                                                                incident.status === 'investigating' ? 'bg-yellow-500/20 text-yellow-400' :
                                                                'bg-green-500/20 text-green-400'
                                                            }`}>
                                                                {incident.status}
                                                            </span>
                                                        </div>
                                                        <h3 className="text-white font-medium mb-1">{incident.title}</h3>
                                                        <p className="text-gray-400 text-sm">{incident.description}</p>
                                                        <div className="mt-2 flex items-center gap-4 text-xs text-gray-500">
                                                            <span>Zone: {incident.zone_id || 'N/A'}</span>
                                                            <span>•</span>
                                                            <span>{new Date(incident.timestamp).toLocaleString()}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                        
                        {/* Quick Links */}
                        <div className="mt-8 grid grid-cols-1 md:grid-cols-3 gap-6">
                            <a href="http://localhost:8000/docs" target="_blank" className="bg-gray-800 rounded-lg p-6 border border-gray-700 hover:border-blue-500 transition-colors">
                                <h3 className="text-lg font-semibold text-white mb-2">API Documentation</h3>
                                <p className="text-gray-400 text-sm">View the complete REST API documentation</p>
                            </a>
                            
                            <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                                <h3 className="text-lg font-semibold text-white mb-2">Real-time Monitoring</h3>
                                <p className="text-gray-400 text-sm">AI-powered vision analysis and alerts</p>
                            </div>
                            
                            <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                                <h3 className="text-lg font-semibold text-white mb-2">Safety Analytics</h3>
                                <p className="text-gray-400 text-sm">Advanced insights and compliance tracking</p>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
